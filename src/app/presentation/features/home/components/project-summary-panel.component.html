@if (open() && summary(); as item) {
  <aside class="project-summary-panel" aria-label="Project summary">
    <header class="project-summary-panel__header">
      <h2>{{ item.projectName }}</h2>
      <button type="button" class="icon-btn" (click)="onClose()" aria-label="Close summary">
        <span class="material-icons">close</span>
      </button>
    </header>
    <dl class="project-summary-panel__body">
      <div>
        <dt>Scheme</dt>
        <dd>{{ item.schemeType }}</dd>
      </div>
      <div>
        <dt>Location</dt>
        <dd>{{ item.locationName || 'Location unavailable' }}</dd>
      </div>
      <div>
        <dt>District</dt>
        <dd>{{ item.districtName || '—' }}</dd>
      </div>
      <div>
        <dt>Block</dt>
        <dd>{{ item.blockName || '—' }}</dd>
      </div>
      <div>
        <dt>Coordinates</dt>
        <dd>{{ item.latitude }}, {{ item.longitude }}</dd>
      </div>
    </dl>
  </aside>
}
