<div class="pf-upload-wrap">
  @if (!listOnly()) {
    <input
      #fileInput
      type="file"
      class="pf-upload-input"
      [accept]="accept()"
      [multiple]="multiple()"
      (change)="fileChange.emit($event)"
    />
    <div class="pf-upload-zone" (click)="triggerBrowse(fileInput)">
      <p class="pf-upload-title">{{ title() }}</p>
      <span class="material-icons pf-upload-icon" aria-hidden="true">cloud_upload</span>
      <p class="pf-upload-hint">
        {{ hint() }}
        <button type="button" class="pf-upload-browse" (click)="$event.stopPropagation(); triggerBrowse(fileInput)">
          Browse
        </button>
      </p>
    </div>
  }
  @if (files().length > 0) {
    <div class="pf-file-chip-list">
      @for (file of files(); track file.file.name + file.file.size) {
        <span class="pf-file-chip">
          <span class="pf-file-chip-name" [title]="file.file.name">{{ file.file.name }}</span>
          <button type="button" class="pf-file-chip-action" aria-label="View file" title="View" (click)="viewFile(file)">
            <span class="material-icons">visibility</span>
          </button>
          @if (!listOnly()) {
            <button type="button" aria-label="Remove file" title="Remove" (click)="fileRemove.emit(file)">
              <span class="material-icons">close</span>
            </button>
          }
        </span>
      }
    </div>
  }
</div>

@if (imagePreview(); as preview) {
  <div class="pf-file-modal-backdrop" (click)="closeImageModal()" role="presentation">
    <div
      class="pf-file-modal"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="preview.name"
      (click)="$event.stopPropagation()"
    >
      <header class="pf-file-modal-header">
        <h3>{{ preview.name }}</h3>
        <button type="button" aria-label="Close preview" (click)="closeImageModal()">
          <span class="material-icons">close</span>
        </button>
      </header>
      <img [src]="preview.src" [alt]="preview.name" />
    </div>
  </div>
}
